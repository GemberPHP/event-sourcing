site_name: Gember Event Sourcing
site_url: https://gemberphp.github.io/event-sourcing/
site_description: Use case driven Event Sourcing for PHP — let go of the Aggregate with the Dynamic Consistency Boundary (DCB) pattern.
repo_url: https://github.com/gemberphp/event-sourcing
repo_name: gember/event-sourcing

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      guess_lang: true
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Background: background.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Example: example.md
  - How It Works: how-it-works.md
  - Library Architecture: library-architecture.md
  - Usage:
      - usage/index.md
      - Use Cases: usage/use-cases.md
      - Commands: usage/commands.md
      - Command Handlers: usage/command-handlers.md
      - Domain Events: usage/domain-events.md
      - Snapshotting: usage/snapshotting.md
      - Sagas: usage/sagas.md
      - Outbox: usage/outbox.md
      - Caching: usage/caching.md
      - Observability: usage/observability.md
